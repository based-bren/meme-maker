                for (let j = 0; j < runLength; j++) {
                    grid[drawIndex++] = colorIndex;
                }
            }
        }

        // Render with selected template and palette
        function render(templateIndex, paletteIndex) {
            if (templateIndex !== undefined) currentTemplateIndex = templateIndex;
            if (paletteIndex !== undefined) currentPaletteIndex = paletteIndex;
            
            // Decode the selected template
            decodeHexData(allTemplates[currentTemplateIndex]);
            
            const palette = allPalettes[currentPaletteIndex].colors;

            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const scale = 16; // 32 * 16 = 512

            // Background
            ctx.fillStyle = '#7132f5'; // INK purple background
            ctx.fillRect(0, 0, 512, 512);

            // Draw pixels
            for (let i = 0; i < grid.length; i++) {
                const colorIndex = grid[i];
                if (colorIndex !== 0) { // Skip transparent
                    const x = i % 32;
                    const y = Math.floor(i / 32);
                    ctx.fillStyle = palette[colorIndex];
                    ctx.fillRect(x * scale, y * scale, scale, scale);
                }
            }

            // Update current palette display
            updatePaletteDisplay(palette);

            // Update ASCII art
            const asciiChars = [' ', '░', '▒', '▓', '█', '▓'];
            let asciiArt = '';
            for (let y = 0; y < 32; y++) {
                for (let x = 0; x < 32; x++) {
                    const index = y * 32 + x;
                    const colorIndex = grid[index];
                    asciiArt += asciiChars[colorIndex];
                }
                asciiArt += '\n';
            }
            document.getElementById('ascii').textContent = asciiArt;

            // Update active state for palettes
            document.querySelectorAll('#paletteGrid .palette-option').forEach((el, idx) => {
                if (idx === currentPaletteIndex) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                }
            });

            // Update active state for templates
            document.querySelectorAll('#templateGrid .palette-option').forEach((el, idx) => {
                if (idx === currentTemplateIndex) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                }
            });

            // Update stats
            updateStats();
        }

        function updatePaletteDisplay(palette) {
            const paletteDiv = document.getElementById('currentPalette');
            paletteDiv.innerHTML = '';

            palette.forEach((color, index) => {
                const colorBox = document.createElement('div');
                colorBox.className = 'color-box';
                colorBox.textContent = index;
                
                if (index === 0) {
                    colorBox.style.background = 'transparent';
                    colorBox.style.borderColor = '#666';
                } else {
                    colorBox.style.background = color;
                    // Determine text color based on brightness
                    const brightness = parseInt(color.substr(1, 2), 16) + 
                                     parseInt(color.substr(3, 2), 16) + 
                                     parseInt(color.substr(5, 2), 16);
                    colorBox.style.color = brightness > 384 ? '#000' : '#fff';
                }
                
                paletteDiv.appendChild(colorBox);
            });

            document.getElementById('paletteInfo').innerHTML = `
                <strong>Template:</strong> #${currentTemplateIndex + 1} of 31<br>
                <strong>Palette:</strong> #${currentPaletteIndex} - ${allPalettes[currentPaletteIndex].name}<br>
                <strong>Index 0:</strong> Transparent (background)<br>
                <strong>Index 1:</strong> Black outline (${palette[1]})<br>
                <strong>Index 2:</strong> White accent (${palette[2]})<br>
                <strong>Index 3:</strong> Dark/shadow (${palette[3]})<br>
                <strong>Index 4:</strong> Medium tone (${palette[4]})<br>
                <strong>Index 5:</strong> Bright/highlight (${palette[5]})
            `;
        }

        // Create template grid with preview
        function createTemplateGrid() {
            const gridElement = document.getElementById('templateGrid');
            
            allTemplates.forEach((template, index) => {
                const option = document.createElement('div');
                option.className = 'palette-option';
                
                // Create mini canvas for preview
                const canvas = document.createElement('canvas');
                canvas.width = 32;
                canvas.height = 32;
                canvas.style.width = '100%';
                canvas.style.height = 'auto';
                canvas.style.imageRendering = 'pixelated';
                
                const ctx = canvas.getContext('2d');
                
                // Decode this template
                const bytes = [];
                for (let i = 0; i < template.length; i += 2) {
                    bytes.push(parseInt(template.substr(i, 2), 16));
                }
                
                const miniGrid = [];
                let drawIndex = 0;
                for (let i = 0; i < bytes.length; i += 2) {
                    const runLength = bytes[i];
                    const colorIndex = bytes[i + 1];
                    for (let j = 0; j < runLength; j++) {
                        miniGrid[drawIndex++] = colorIndex;
                    }
                }
                
                // Draw preview with first palette
                const previewPalette = allPalettes[0].colors;
                ctx.fillStyle = '#7132f5';
                ctx.fillRect(0, 0, 32, 32);
                
                for (let i = 0; i < miniGrid.length; i++) {
                    const colorIndex = miniGrid[i];
                    if (colorIndex !== 0) {
                        const x = i % 32;
                        const y = Math.floor(i / 32);
                        ctx.fillStyle = previewPalette[colorIndex];
                        ctx.fillRect(x, y, 1, 1);
                    }
                }
                
                const name = document.createElement('div');
                name.className = 'palette-name';
                name.textContent = `Template #${index + 1}`;
                
                option.appendChild(canvas);
                option.appendChild(name);
                option.onclick = () => render(index, undefined);
                
                gridElement.appendChild(option);
            });
        }

        // Create palette grid
        function createPaletteGrid() {
            const gridElement = document.getElementById('paletteGrid');
            
            allPalettes.forEach((palette, index) => {
                const option = document.createElement('div');
                option.className = 'palette-option';
                
                const colors = document.createElement('div');
                colors.className = 'palette-colors';
                
                // Show colors 1-5 (skip transparent)
                for (let i = 1; i < palette.colors.length; i++) {
                    const colorDiv = document.createElement('div');
                    colorDiv.style.background = palette.colors[i];
                    colors.appendChild(colorDiv);
                }
                
                const name = document.createElement('div');
                name.className = 'palette-name';
                name.textContent = `${index}: ${palette.name}`;
                
                option.appendChild(colors);
                option.appendChild(name);
                option.onclick = () => render(undefined, index);
                
                gridElement.appendChild(option);
            });
        }

        function updateStats() {
            const colorCounts = [0, 0, 0, 0, 0, 0];
            grid.forEach(c => colorCounts[c]++);
            const hexData = allTemplates[currentTemplateIndex];
            
            document.getElementById('stats').innerHTML = `
                <strong>Total bytes in hex string:</strong> ${hexData.length / 2}<br>
                <strong>Total RLE runs:</strong> ${totalRuns}<br>
                <strong>Total pixels decoded:</strong> ${grid.length}<br>
                <strong>Pixels by color:</strong><br>
                &nbsp;&nbsp;- Transparent (0): ${colorCounts[0]} pixels<br>
                &nbsp;&nbsp;- Black outline (1): ${colorCounts[1]} pixels<br>
                &nbsp;&nbsp;- White (2): ${colorCounts[2]} pixels<br>
                &nbsp;&nbsp;- Dark (3): ${colorCounts[3]} pixels<br>
                &nbsp;&nbsp;- Medium (4): ${colorCounts[4]} pixels<br>
                &nbsp;&nbsp;- Bright (5): ${colorCounts[5]} pixels<br>
                <strong>Compression ratio:</strong> ${((1 - (hexData.length / 2) / (32 * 32)) * 100).toFixed(1)}% saved
            `;
        }

        // Initialize
        createTemplateGrid();
        createPaletteGrid();
        render(0, 0);
    </script>
</body>
</html>
