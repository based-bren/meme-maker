<!DOCTYPE html>
<html>
<head>
    <title>Gems Visualizer</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .controls {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .control-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .control-group {
            margin-bottom: 15px;
        }
        .control-group label {
            display: block;
            margin-bottom: 8px;
            color: #faec32;
            font-weight: bold;
        }
        .palette-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        .template-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        .palette-option, .template-option, .bg-option {
            background: #1a1a1a;
            border: 3px solid #444;
            border-radius: 8px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .palette-option:hover, .template-option:hover, .bg-option:hover {
            border-color: #faec32;
            transform: scale(1.05);
        }
        .palette-option.active, .template-option.active, .bg-option.active {
            border-color: #faec32;
            box-shadow: 0 0 15px #faec32;
        }
        .palette-colors {
            display: flex;
            gap: 2px;
            margin-bottom: 5px;
        }
        .palette-colors div {
            flex: 1;
            height: 25px;
            border: 1px solid #000;
        }
        .palette-name, .template-name {
            text-align: center;
            font-size: 11px;
            color: #aaa;
        }
        .bg-option {
            height: 80px;
        }
        .toggle-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
        }
        .toggle {
            position: relative;
            width: 60px;
            height: 30px;
            background: #444;
            border-radius: 15px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .toggle.active {
            background: #faec32;
        }
        .toggle::after {
            content: '';
            position: absolute;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: white;
            top: 2px;
            left: 2px;
            transition: left 0.3s;
        }
        .toggle.active::after {
            left: 32px;
        }
        canvas {
            border: 2px solid #faec32;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        .info {
            margin-top: 20px;
            background: #2a2a2a;
            padding: 15px;
            border-radius: 5px;
        }
        .color-box {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 2px solid #fff;
            margin: 5px;
            text-align: center;
            line-height: 50px;
            font-size: 20px;
            font-weight: bold;
        }
        h1 {
            color: #faec32;
            text-align: center;
        }
        h2 {
            color: #faec32;
            margin-top: 0;
        }
    </style>
</head>

        ];

        // All 16 shine templates from the contract
        const allShineTemplates = [
            '260001023f0001021f0001021b00010201000202010302021d0001021f000102',
            'c70001021e000102010301021e000102ff00b20001021e000102010301021e000102',
            '250001023f0001021e0003021b0003020103030201000102190003021e0001021f0001023f000102ff00b60001023f0001021e000102010301021e000102',
            '480001021c000102010001020103010201000102100001020b00010212000102010301021e000102ff00ff002a0001023f0001021b0001020200010201030102010001021c0001021f0001023f000102',
            'da0001023f0001021c00010201000102010302021d0001023f000102c80001023f0001021f0001021e00010201030102010001021c000102230001021e000102010301021e0001023f000102',
            '47000102060001021e000102010301021700010206000102180001021b0001020100020201030102010001021c0001023f000102',
            '460001023f0001021e000102010301023e000102ff00ff0054000102210001021e000102010341000102',
            '270001021f0001021a0001020200020201030202020001021a0001021f000102ff00ff00600001021b00010202000102010301021e0001023f000102090001021e000102010301021e000102',
            '450001021600010209000202140001020900010201030d00010203000102010001020103010201000102000208000102130001021f0001023f000102',
            '290001021f0001021d000102030001021d0001029b0001031f0001031b00010301000203010202031d0001033f000103ff00360001033f0001031e000103010201031e0001033f000103',
            '460001021f0001033c0001020103030001030102010001021a0001031f0001023f000102ff00960001025f0001021f0001021f0001031c00020203000103010200023c0001021f000102',
            '850001021e000102010301021e000102ff00ff00b90001021e000102010301021e000102',
            '7a0001021b000102020003021e0001023f000102690001025f0001021c0001020100010201030102010001021c0001023f000102',
            '22000102080001021b000102010001030300010302021200010208000103160001020800010214000202010302021d0001021f0001023f0001023a0001023f0001021d000102010001020100010200023d000102',
            '2c000102030001031300010206000102010301021600010207000102130001030100020202030102010001031b0001020700010317000102400001031d0001021e000102010301021e000102',
            '3c0001025f0001021f0001021f0001031c00010201000102010301021e0001021f0001023f000102c10001021e0001020103010200021e0001027d0001023f0001021c000102010003021e0001021f000102'
        ];
        
        // All 17 color palettes from the contract
        const allPalettes = [
            { name: "Red Light", colors: ["transparent", "#000000", "#fdffd0", "#f0f0f0", "#ff99a5", "#ff3419", "#d61900"] },
            { name: "Red Medium", colors: ["transparent", "#000000", "#fdffd0", "#f0f0f0", "#ff3419", "#d61900", "#b30015"] },
            { name: "Red Dark", colors: ["transparent", "#000000", "#fdffd0", "#f0f0f0", "#d61900", "#b30015", "#60000e"] },
            { name: "Cyan Aqua", colors: ["transparent", "#000000", "#fdffd0", "#f0f0f0", "#93d9d3", "#56b8b3", "#002365"] },
            { name: "Obsidian", colors: ["transparent", "#000000", "#fdffd0", "#f0f0f0", "#858585", "#003632", "#2a2a2a"] },
            { name: "Blue Medium", colors: ["transparent", "#000000", "#fdffd0", "#f0f0f0", "#00acf5", "#0068de", "#023bac"] },
            { name: "Blue Cyan", colors: ["transparent", "#000000", "#fdffd0", "#f0f0f0", "#00e9f5", "#00acf5", "#0068de"] },
            { name: "Purple Medium", colors: ["transparent", "#000000", "#fdffd0", "#f0f0f0", "#7b47ff", "#532ee6", "#0928b3"] },
            { name: "Purple Light", colors: ["transparent", "#000000", "#fdffd0", "#f0f0f0", "#d580ff", "#7b47ff", "#532ee6"] },
            { name: "Green Dark", colors: ["transparent", "#000000", "#fdffd0", "#f0f0f0", "#2ab539", "#00807b", "#003632"] },
            { name: "Green Medium", colors: ["transparent", "#000000", "#fdffd0", "#f0f0f0", "#66d330", "#2ab539", "#00807b"] },
            { name: "Green Light", colors: ["transparent", "#000000", "#fdffd0", "#f0f0f0", "#abff2d", "#66d330", "#2ab539"] },
            { name: "Yellow Orange", colors: ["transparent", "#000000", "#fdffd0", "#f0f0f0", "#faec32", "#ffa500", "#db6a00"] },
            { name: "Pink Dark", colors: ["transparent", "#000000", "#fdffd0", "#f0f0f0", "#e65c6a", "#b31954", "#73002b"] },
            { name: "Pink Light", colors: ["transparent", "#000000", "#fdffd0", "#f0f0f0", "#ff828f", "#e65c6a", "#b31954"] },
            { name: "Orange", colors: ["transparent", "#000000", "#fdffd0", "#f0f0f0", "#ff6600", "#e63600", "#b30c00"] },
            { name: "Orange Light", colors: ["transparent", "#000000", "#fdffd0", "#f0f0f0", "#ffa733", "#ff6600", "#e63600"] }
        ];

        const backgroundColors = ["#b2b2b2", "#858585", "#585858", "#2a2a2a"];

        let currentGemTemplateIndex = 0;
        let currentPaletteIndex = 0;
        let currentBackgroundIndex = 0;
        let currentShineTemplateIndex = 0;
        let shineEnabled = false;
        let grid = [];
        let shineGrid = [];

        // Decode hex data to grid
        function decodeHexData(hexData) {
            const bytes = [];
            for (let i = 0; i < hexData.length; i += 2) {
                bytes.push(parseInt(hexData.substr(i, 2), 16));
            }

            const grid = [];
            let drawIndex = 0;

            for (let i = 0; i < bytes.length; i += 2) {
                const runLength = bytes[i];
                const colorIndex = bytes[i + 1];
                for (let j = 0; j < runLength; j++) {
                    grid[drawIndex++] = colorIndex;
                }
            }

            return grid;
        }

        // Render the current configuration
        function render() {
            grid = decodeHexData(allGemTemplates[currentGemTemplateIndex]);
            if (shineEnabled) {
                shineGrid = decodeHexData(allShineTemplates[currentShineTemplateIndex]);
            }

            const palette = allPalettes[currentPaletteIndex].colors;
            const backgroundColor = backgroundColors[currentBackgroundIndex];

            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const scale = 16; // 32 * 16 = 512

            // Background
            ctx.fillStyle = backgroundColor;
            ctx.fillRect(0, 0, 512, 512);

            // Draw gem
            for (let i = 0; i < grid.length; i++) {
                const colorIndex = grid[i];
                if (colorIndex !== 0) {
                    const x = i % 32;
                    const y = Math.floor(i / 32);
                    ctx.fillStyle = palette[colorIndex];
                    ctx.fillRect(x * scale, y * scale, scale, scale);
                }
            }

            // Draw shine overlay if enabled
            if (shineEnabled) {
                for (let i = 0; i < shineGrid.length; i++) {
                    const colorIndex = shineGrid[i];
                    if (colorIndex !== 0) {
                        const x = i % 32;
                        const y = Math.floor(i / 32);
                        ctx.fillStyle = palette[colorIndex];
                        ctx.fillRect(x * scale, y * scale, scale, scale);
                    }
                }
            }

            updateConfigDisplay();
            updateActiveStates();
        }

        function updateConfigDisplay() {
            const refinement = currentGemTemplateIndex <= 8 ? "Cut" : "Raw";
            const shineStatus = shineEnabled ? "On" : "Off";
            
            document.getElementById('configInfo').innerHTML = `
                <strong>Gem Template:</strong> #${currentGemTemplateIndex + 1} of 24 (${refinement})<br>
                <strong>Color Palette:</strong> #${currentPaletteIndex + 1} - ${allPalettes[currentPaletteIndex].name}<br>
                <strong>Background:</strong> #${currentBackgroundIndex + 1}<br>
                <strong>Shine:</strong> ${shineStatus}${shineEnabled ? ` (Pattern #${currentShineTemplateIndex + 1})` : ''}<br>
            `;

            const palette = allPalettes[currentPaletteIndex].colors;
            const paletteDiv = document.getElementById('currentPalette');
            paletteDiv.innerHTML = '<h3 style="color: #faec32;">Palette Colors:</h3>';
            
            palette.forEach((color, index) => {
                if (index > 0) { // Skip transparent
                    const colorBox = document.createElement('div');
                    colorBox.className = 'color-box';
                    colorBox.textContent = index;
                    colorBox.style.background = color;
                    const brightness = parseInt(color.substr(1, 2), 16) + 
                                     parseInt(color.substr(3, 2), 16) + 
                                     parseInt(color.substr(5, 2), 16);
                    colorBox.style.color = brightness > 384 ? '#000' : '#fff';
                    paletteDiv.appendChild(colorBox);
                }
            });

            const colorCounts = [0, 0, 0, 0, 0, 0, 0];
            grid.forEach(c => colorCounts[c]++);
            
            const hexData = allGemTemplates[currentGemTemplateIndex];
            document.getElementById('stats').innerHTML = `
                <strong>Gem bytes:</strong> ${hexData.length / 2}<br>
                ${shineEnabled ? `<strong>Shine bytes:</strong> ${allShineTemplates[currentShineTemplateIndex].length / 2}<br>` : ''}
                <strong>Total pixels:</strong> ${grid.length}<br>
                <strong>Pixels by color:</strong><br>
                ${colorCounts.map((count, idx) => idx > 0 ? `&nbsp;&nbsp;- Index ${idx}: ${count} pixels<br>` : '').join('')}
            `;
        }

        function updateActiveStates() {
            document.querySelectorAll('#gemTemplateGrid .template-option').forEach((el, idx) => {
                el.classList.toggle('active', idx === currentGemTemplateIndex);
            });

            document.querySelectorAll('#paletteGrid .palette-option').forEach((el, idx) => {
                el.classList.toggle('active', idx === currentPaletteIndex);
            });

            document.querySelectorAll('#bgGrid .bg-option').forEach((el, idx) => {
                el.classList.toggle('active', idx === currentBackgroundIndex);
            });

            if (shineEnabled) {
                document.querySelectorAll('#shineTemplateGrid .template-option').forEach((el, idx) => {
                    el.classList.toggle('active', idx === currentShineTemplateIndex);
                });
            }
        }

        // Create gem template grid
        function createGemTemplateGrid() {
            const gridElement = document.getElementById('gemTemplateGrid');
            
            allGemTemplates.forEach((template, index) => {
                const option = document.createElement('div');
                option.className = 'template-option';
                
                const canvas = document.createElement('canvas');
                canvas.width = 32;
                canvas.height = 32;
                canvas.style.width = '100%';
                canvas.style.imageRendering = 'pixelated';
                
                const ctx = canvas.getContext('2d');
                const miniGrid = decodeHexData(template);
                const previewPalette = allPalettes[0].colors;
                
                ctx.fillStyle = backgroundColors[0];
                ctx.fillRect(0, 0, 32, 32);
                
                for (let i = 0; i < miniGrid.length; i++) {
                    const colorIndex = miniGrid[i];
                    if (colorIndex !== 0) {
                        const x = i % 32;
                        const y = Math.floor(i / 32);
                        ctx.fillStyle = previewPalette[colorIndex];
                        ctx.fillRect(x, y, 1, 1);
                    }
                }
                
                const name = document.createElement('div');
                name.className = 'template-name';
                const refinement = index <= 8 ? "Cut" : "Raw";
                name.textContent = `#${index + 1} (${refinement})`;
                
                option.appendChild(canvas);
                option.appendChild(name);
                option.onclick = () => {
                    currentGemTemplateIndex = index;
                    render();
                };
                
                gridElement.appendChild(option);
            });
        }

        // Create shine template grid
        function createShineTemplateGrid() {
            const gridElement = document.getElementById('shineTemplateGrid');
            
            allShineTemplates.forEach((template, index) => {
                const option = document.createElement('div');
                option.className = 'template-option';
                
                const canvas = document.createElement('canvas');
                canvas.width = 32;
                canvas.height = 32;
                canvas.style.width = '100%';
                canvas.style.imageRendering = 'pixelated';
                
                const ctx = canvas.getContext('2d');
                const miniGrid = decodeHexData(template);
                const previewPalette = allPalettes[0].colors;
                
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, 32, 32);
                
                for (let i = 0; i < miniGrid.length; i++) {
                    const colorIndex = miniGrid[i];
                    if (colorIndex !== 0) {
                        const x = i % 32;
                        const y = Math.floor(i / 32);
                        ctx.fillStyle = previewPalette[colorIndex];
                        ctx.fillRect(x, y, 1, 1);
                    }
                }
                
                const name = document.createElement('div');
                name.className = 'template-name';
                name.textContent = `Shine #${index + 1}`;
                
                option.appendChild(canvas);
                option.appendChild(name);
                option.onclick = () => {
                    currentShineTemplateIndex = index;
                    render();
                };
                
                gridElement.appendChild(option);
            });
        }

        // Create palette grid
        function createPaletteGrid() {
            const gridElement = document.getElementById('paletteGrid');
            
            allPalettes.forEach((palette, index) => {
                const option = document.createElement('div');
                option.className = 'palette-option';
                
                const colors = document.createElement('div');
                colors.className = 'palette-colors';
                
                // Show colors 1-6 (skip transparent)
                for (let i = 1; i < palette.colors.length; i++) {
                    const colorDiv = document.createElement('div');
                    colorDiv.style.background = palette.colors[i];
                    colors.appendChild(colorDiv);
                }
                
                const name = document.createElement('div');
                name.className = 'palette-name';
                name.textContent = `${index + 1}: ${palette.name}`;
                
                option.appendChild(colors);
                option.appendChild(name);
                option.onclick = () => {
                    currentPaletteIndex = index;
                    render();
                };
                
                gridElement.appendChild(option);
            });
        }

        // Create background grid
        function createBackgroundGrid() {
            const gridElement = document.getElementById('bgGrid');
            
            backgroundColors.forEach((color, index) => {
                const option = document.createElement('div');
                option.className = 'bg-option';
                option.style.background = color;
                
                const name = document.createElement('div');
                name.className = 'palette-name';
                name.textContent = `BG #${index + 1}`;
                name.style.padding = '5px';
                name.style.background = 'rgba(0,0,0,0.5)';
                name.style.marginTop = '30px';
                
                option.appendChild(name);
                option.onclick = () => {
                    currentBackgroundIndex = index;
                    render();
                };
                
                gridElement.appendChild(option);
            });
        }

        // Setup shine toggle
        function setupShineToggle() {
            const toggle = document.getElementById('shineToggle');
            const container = document.getElementById('shineTemplateContainer');
            
            toggle.onclick = () => {
                shineEnabled = !shineEnabled;
                toggle.classList.toggle('active', shineEnabled);
                container.style.display = shineEnabled ? 'block' : 'none';
                render();
            };
        }

        // Initialize
        createGemTemplateGrid();
        createShineTemplateGrid();
        createPaletteGrid();
        createBackgroundGrid();
        setupShineToggle();
        render();
    </script>
